plugins {
    id 'com.android.application'
}

// 버전: 릴리즈 워크플로가 태그(v1.2.3)에서 넘겨 주고, 없으면 아래 기본값을 쓴다.
// versionCode는 버전에서 계산한다(1.2.3 → 10203). 새 버전을 낼 때 기본값도 함께 올린다.
def appVersion = (project.findProperty('appVersion') ?: '2.5.0').toString()
def vparts = (appVersion.tokenize('.') + ['0', '0', '0']).take(3).collect { (it.replaceAll(/[^0-9]/, '') ?: '0') as int }
def appVersionCode = vparts[0] * 10000 + vparts[1] * 100 + vparts[2]

android {
    namespace 'com.vegacitizen.zombiefarm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vegacitizen.zombiefarm'
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion
    }

    // 빌드할 때마다 같은 키로 서명해야 기존 앱 위에 덮어 설치되고 저장 데이터가 유지된다.
    // 저장소에 들어 있는 디버그 전용 키이므로 스토어 배포용으로는 쓰지 않는다.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // 디버그 표시가 없는 배포용 빌드. 같은 키로 서명해 기존 앱 위에 덮어 설치된다.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // APK 파일 이름: 배포용은 ZombieFarm.apk, 디버그용은 ZombieFarm-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = variant.buildType.name == 'release' ? 'ZombieFarm.apk' : "ZombieFarm-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
