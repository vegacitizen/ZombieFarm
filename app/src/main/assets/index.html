<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZombieFarm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* layout: full-screen canvas game, DOM overlays for menus and the action button */
  :root{--bg:#3b2a22;--ink:#4a3226;--paper:#fff6e3;--accent:#ff8a3d;--good:#3fae6a;--bad:#e2493f;--soap:#6fd3e8;
    --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color-scheme:light}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--display);color:var(--ink)}
  body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
  [hidden]{display:none!important}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #pad{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .prow{display:flex;align-items:flex-end;gap:10px}
  .pb{width:78px;height:78px;border-radius:50%;border:4px solid var(--paper);color:#fff;font:19px var(--display);touch-action:none;cursor:pointer;padding:0;
    box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.3)}
  .pb.big{width:100px;height:100px;font-size:23px;background:var(--accent)}
  .pb.sm{width:64px;height:64px;font-size:15px}
  #bJump{background:#8b6fd6} #bWhistle{background:#d96a9a} #bBubble{background:#3fb7c9}
  #bThrow{background:#2aa7c9;width:88px;height:88px;font-size:20px}
  .pb.off{background:#9c8b80!important;opacity:.5}
  .pb:active{transform:translateY(3px)}
  @media (max-height:480px){.pb{width:58px;height:58px;font-size:15px}.pb.big{width:76px;height:76px;font-size:18px}.pb.sm{width:48px;height:48px;font-size:12px}#pad{gap:5px}}
  #pz{position:fixed;left:calc(68px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;
    border:3px solid var(--paper);background:rgba(74,50,38,.8);font-size:18px;cursor:pointer;padding:0;touch-action:none;z-index:5;color:#fff}
  #snd{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;
    border:3px solid var(--paper);background:rgba(74,50,38,.8);font-size:20px;cursor:pointer;padding:0;touch-action:none;z-index:5}
  .pb:focus-visible,.buy:focus-visible,.btn:focus-visible{outline:4px solid var(--soap);outline-offset:3px}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,24,16,.72);
    padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
  #card{background:var(--paper);border-radius:26px;border:6px solid var(--ink);max-width:640px;width:100%;
    padding:20px 24px;box-sizing:border-box;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.25);max-height:100%;overflow:auto}
  #card h1{font-size:clamp(34px,7vw,56px);margin:0;color:var(--accent);font-weight:400;text-shadow:0 3px 0 var(--ink);letter-spacing:1px}
  #card h2{font-size:clamp(22px,4.4vw,30px);margin:0 0 6px;font-weight:400}
  #card p{font-size:clamp(14px,2.6vw,17px);line-height:1.5;margin:8px 0}
  .sub{color:#8a6a55}
  .rows{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
  .chip{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:clamp(14px,2.6vw,17px)}
  .chip b{font-weight:400;color:var(--accent)}
  .signs{text-align:left;font-size:clamp(13px,2.4vw,15.5px);line-height:1.55;margin:8px auto;display:grid;gap:2px}
  .btn{font:clamp(20px,4vw,26px) var(--display);background:var(--accent);color:#fff;border:4px solid var(--ink);border-radius:18px;
    padding:10px 34px;margin-top:10px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
  .btn.alt{background:#b9ada4}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .stars{font-size:40px;letter-spacing:6px;color:#ffb81f;text-shadow:0 2px 0 var(--ink)}
  .goodc{color:var(--good)} .badc{color:var(--bad)}
  .note{background:#fffbe6;border:2px dashed #c9a56a;border-radius:12px;padding:8px 14px;margin:8px auto;font-size:clamp(14px,2.6vw,17px);line-height:1.5;text-align:left;transform:rotate(-.6deg)}
  .note b{display:block;font-weight:400;color:var(--accent);font-size:.85em}
  .pay{font-size:clamp(16px,3vw,20px)!important} .pay b{color:var(--accent)}
  .shop{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;margin:6px 0;font-size:clamp(13px,2.4vw,16px)}
  .shop .si{font-size:26px} .shop .sn{flex:1;min-width:0} .shop b{font-weight:400} .pip{color:var(--accent);letter-spacing:2px}
  .buy{font:clamp(14px,2.6vw,17px) var(--display);background:var(--good);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;min-width:88px;cursor:pointer}
  .buy:disabled{background:#b9ada4;cursor:default;opacity:.7}
  #bHose{background:#2aa7c9;width:88px;height:88px;font-size:20px} #bHose.on{background:#1b7f9c;transform:translateY(3px)}
  #bGun{background:#7a5a48}
  #bShop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));font:18px var(--display);background:var(--good);color:#fff;
    border:3px solid var(--paper);border-radius:16px;padding:8px 16px;cursor:pointer;touch-action:none;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  #mini{position:fixed;left:auto;bottom:auto;right:calc(16px + env(safe-area-inset-right,0px));top:calc(124px + env(safe-area-inset-top,0px));width:168px;height:92px;border:3px solid var(--paper);border-radius:12px;background:#4a3226;z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:pointer;touch-action:none}
  @media (max-height:420px){#mini{width:124px;height:68px;top:calc(116px + env(safe-area-inset-top,0px))}}
  #bigmap{position:static;display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:12px;margin:4px auto;touch-action:none;cursor:pointer}
  #bWork{background:#3fae6a} #bWood{background:#a9744f} #bEat{background:#c2523f} #bEat.off{opacity:.45}
  #ex{position:static;display:block;margin:4px auto;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 200px);aspect-ratio:7/3;border:3px solid var(--ink);border-radius:14px;touch-action:none;cursor:pointer}
  #card .exh{margin:2px 0} .btn.exq{font-size:15px;padding:4px 18px;margin-top:6px}
  .btn:disabled{background:#b9ada4;opacity:.7;cursor:default}
  .cert{background:#fffbe6;border:4px double #c9a56a;border-radius:10px;padding:14px 18px;margin:10px auto;max-width:440px;font-size:clamp(14px,2.6vw,17px);line-height:1.5}
  .cert b{display:block;font-weight:400;color:var(--accent);font-size:1.35em;margin-bottom:4px}
  #bDrop{background:#b98f52;font-size:13px}
  #bCar{background:#3f6fa8;font-size:13px}
  #bSwap{background:#6b5a8f;font-size:17px;letter-spacing:-2px}
  #bDex{position:fixed;left:calc(122px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:3px solid var(--paper);background:rgba(74,50,38,.8);font-size:19px;cursor:pointer;padding:0;touch-action:none;z-index:5}
  .dex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 6px}
  .dex span{width:46px;height:46px;border-radius:12px;border:3px solid #cbb9a8;background:#efe6d6;display:flex;align-items:center;justify-content:center;font-size:20px;opacity:.55}
  .dex span.on{border-color:var(--ink);background:#fff;opacity:1}
  #card .dexh{margin:6px 0 0}
  #ov{touch-action:pan-y} #card{touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:2px 0 8px}
  .buy.tile{min-width:86px;padding:6px 10px;background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(13px,2.4vw,15px)}
  .buy.tile span{font-size:26px;line-height:1.1}
  .buy.tile.on,.buy.tile.on:disabled{background:var(--accent);color:#fff;opacity:1}
  .buy.tile:disabled{background:#e6ddd0;opacity:.6}
  .tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .cell{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;vertical-align:top;width:92px;min-height:96px;margin:3px;padding:6px 4px 5px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;font:13px var(--display);cursor:pointer}
  .cell .ci{font-size:28px;line-height:1.15} .cell .cn{font-size:12.5px;line-height:1.2;max-height:2.4em;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
  .cell .cp{margin-top:auto;font-size:12px;background:var(--good);color:#fff;border-radius:999px;padding:1px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .cell.off{background:#ece4d8;border-color:#b9ada4} .cell.off .ci,.cell.off .cn{opacity:.55} .cell.off .cp{background:#b9ada4}
  .cell.own{background:#eef7e6} .cell.own .cp{background:#7fae5a}
  .cell.sel{outline:4px solid var(--accent);outline-offset:1px}
  #det{position:sticky;bottom:-2px;background:var(--paper);border-top:3px solid var(--ink);margin:8px -6px 0;padding:8px 8px 6px;text-align:left;z-index:2}
  #det .dh{display:flex;align-items:center;gap:8px;font-size:clamp(16px,3vw,19px)} #det .dh .ci{font-size:26px} #det .dh b{font-weight:400}
  #det .ds{margin:4px 0;color:#8a6a55;font-size:clamp(13px,2.4vw,15px);line-height:1.35} #det .dno{margin:4px 0;color:#c0392b;font-size:clamp(14px,2.6vw,16px)} #det .dok{margin:4px 0;color:#3f8f4a}
  #det .dh b{flex:1;min-width:0} #det .btn{margin:0;padding:5px 16px;font-size:clamp(14px,2.6vw,17px);white-space:nowrap} #det .dh .dok{font-size:14px;white-space:nowrap}
  #det .ds{max-height:4.1em;overflow-y:auto}
  .shoph{margin:0 0 4px}
  .bq{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:5px 0 2px} .bq .bl{color:#8a6a55;font-size:13px;margin-left:4px} .bq .qn{min-width:22px;text-align:center;font-weight:400;font-size:17px}
  .chip{font:14px var(--display);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer} .chip.on{background:var(--accent);color:#fff}
  @media (max-height:560px){ #card .tabs{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;margin:4px 0;padding-bottom:2px} #card .tab{white-space:nowrap;padding:4px 9px;font-size:14px;flex:0 0 auto}
    .cell{width:84px;min-height:86px;margin:2px} .cell .ci{font-size:24px} #det{padding:5px 8px 4px} #det .ds{max-height:2.8em} }
  details.help{text-align:left;margin:8px 0} details.help summary{cursor:pointer;color:#8a6a55;font-size:clamp(13px,2.4vw,15px)}
  .tab{font:clamp(14px,2.6vw,17px) var(--display);background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer}
  .tab.on{background:var(--accent);color:#fff}
  .sec{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font:clamp(15px,2.8vw,18px) var(--display);background:#f6ead8;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;margin:8px 0 2px;cursor:pointer;text-align:left}
  .sec.on{background:#ffe2a8}
  .sec .sc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .sec i{font-style:normal;font-size:.78em;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap}
  .sec i.can{background:var(--accent);color:#fff}
  .tab:focus-visible{outline:4px solid var(--soap);outline-offset:3px}
  /* 화면 가장자리를 살짝 어둡게, 버튼과 창에 입체감과 눌림·등장 동작 */
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 56%,rgba(0,0,0,0) 58%,rgba(34,20,10,.3) 100%)}
  .pb,#bShop,#snd,#pz,#bDex{background-image:linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,0) 52%,rgba(0,0,0,.1));transition:transform .08s,filter .08s;text-shadow:0 1px 0 rgba(0,0,0,.28)}
  .pb:active,#bShop:active,#snd:active,#pz:active,#bDex:active{transform:translateY(3px) scale(.96);filter:brightness(.92)}
  #snd,#pz,#bDex{display:flex;align-items:center;justify-content:center;color:#fff6e3;box-shadow:0 4px 0 rgba(0,0,0,.3)}
  #snd[hidden],#pz[hidden],#bDex[hidden]{display:none}
  #snd svg,#pz svg,#bDex svg{width:24px;height:24px;display:block}
  #bShop{display:flex;align-items:center;gap:6px} #bShop[hidden]{display:none} #bShop svg{width:21px;height:21px}
  /* 메뉴 정돈: 위에 고정된 닫기 버튼, 아이콘 탭, 미스터리 상자, 접히는 도움말 */
  .xbtn{position:sticky;top:0;float:right;margin:-8px -12px 0 8px;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff;color:var(--ink);font:20px var(--display);cursor:pointer;z-index:4;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  #card .tabs{flex-wrap:wrap;overflow:visible;justify-content:center}
  #card .tab{display:inline-flex;flex-direction:column;align-items:center;gap:0;min-width:62px;padding:3px 8px 4px;font-size:13px;white-space:nowrap;flex:0 0 auto}
  #card .tab span{font-size:22px;line-height:1.15}
  .myst{display:contents} .cell.mb{border-style:dashed;border-color:#c9a56a;background:#fff7e0;cursor:default} .cell.mb .cp{background:#c9a56a} .cell.mb .ci{animation:wob 1.6s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .cell.new{border-color:var(--accent);background:#fff1e0;cursor:default} .cell.new .cp{background:var(--accent)}
  details.help p,details.fold p{margin:6px 0} details.fold{margin:6px 0;text-align:center} details.fold summary{cursor:pointer;font:clamp(15px,2.8vw,18px) var(--display);background:#f6ead8;border:3px solid var(--ink);border-radius:12px;padding:7px 12px;text-align:left}
  #det:not(.sel){position:static}
  /* 길잡이: 지금 누를 버튼을 노란 테와 손가락으로 짚어 준다 */
  .hint{outline:4px solid #ffd54a;outline-offset:3px;animation:hintP .9s ease-in-out infinite} .pb.hint{position:relative}
  .pb.hint::after{content:'👇';position:absolute;left:50%;top:-34px;margin-left:-13px;font-size:26px;animation:hintB .7s ease-in-out infinite;pointer-events:none}
  @keyframes hintP{0%,100%{outline-color:#ffd54a}50%{outline-color:#fff}} @keyframes hintB{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
  .cred{text-align:left;font-size:clamp(13px,2.4vw,15px);line-height:1.5;color:#6b4a3a} .cred b{color:var(--ink);font-weight:400} .cred p{margin:6px 0}
  #savebox{width:100%;height:90px;box-sizing:border-box;font:12px monospace;border:3px solid var(--ink);border-radius:10px;padding:6px;background:#fff}
  /* 가축 수확 버튼: 늘 같은 자리에 있고, 할 일이 생기면 색이 켜지며 두근거린다 */
  #bGraze{background:#8a6a3a;font-size:13px;line-height:1.1} #bGraze.out{background:#d9822b}
  #bWork{font-size:14px;line-height:1.15} #bWork.rdy{animation:rdy 1s ease-in-out infinite}
  @keyframes rdy{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.9),0 5px 0 rgba(0,0,0,.35)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0),0 5px 0 rgba(0,0,0,.35)}}
  @media (max-height:480px){#bWork{font-size:12px}}
  #zoomR{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));border:3px solid var(--paper);border-radius:999px;background:rgba(74,50,38,.8);color:#fff;font:14px var(--display);padding:5px 11px;cursor:pointer;z-index:5;touch-action:none}
  #det .more{color:var(--accent);cursor:pointer;white-space:nowrap}
  #bigmap{width:auto;max-width:100%;max-height:calc(100vh - 150px)}
  /* 도구: 자주 쓰는 세 칸과 팔레트 버튼 */
  .pb.qs{width:52px;height:52px;font-size:22px;background:#6b5a8f;padding:0} .pb.qs.on{background:var(--accent);box-shadow:0 0 0 3px #fff,0 5px 0 rgba(0,0,0,.35)}
  #bSwap{background:#4a3226;font-size:22px;letter-spacing:0}
  @media (max-height:480px){.pb.qs{width:46px;height:46px;font-size:20px}#bHose{width:76px;height:76px;font-size:18px}}
  #card{animation:cardIn .24s cubic-bezier(.2,1.5,.4,1)}
  @keyframes cardIn{from{transform:scale(.9) translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .btn,.buy,.tab,.cell{transition:transform .08s,filter .08s} .buy:active:not(:disabled),.tab:active,.cell:active{transform:translateY(2px);filter:brightness(.94)}
  @media (prefers-reduced-motion:reduce){#card{animation:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<canvas id="cv"></canvas>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="SkeletonUtils.js"></script>
<script src="pack_models.js"></script>
<div id="pad" hidden>
 <div class="prow" id="quick">
  <button id="q0" class="pb qs" type="button" hidden></button>
  <button id="q1" class="pb qs" type="button" hidden></button>
  <button id="q2" class="pb qs" type="button" hidden></button>
  <button id="bSwap" class="pb sm" type="button" aria-label="도구 고르기">🧰</button>
 </div>
 <div class="prow">
  <button id="bDrop" class="pb sm" type="button" hidden>내려놓기</button>
  <button id="bCar" class="pb sm" type="button" hidden>내리기</button>
  <button id="bWood" class="pb sm" type="button" hidden>목공</button>
  <button id="bGraze" class="pb sm" type="button" hidden>🐕</button>
  <button id="bEat" class="pb sm" type="button" hidden aria-label="음식 먹기">🍖</button>
  <button id="bWork" class="pb off" type="button" hidden>🧺</button>
  <button id="bGun" class="pb sm off" type="button" hidden>총</button>
 </div>
 <div class="prow">
  <button id="bHose" class="pb off" type="button">호스</button>
  <button id="bAct" class="pb big off" type="button">행동</button>
 </div>
</div>
<button id="bShop" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.4l2.2 10.2h10.2L20 7H7"/><circle cx="9.5" cy="18.6" r="1.5" fill="currentColor"/><circle cx="16.6" cy="18.6" r="1.5" fill="currentColor"/></svg>상점</button>
<canvas id="mini" width="336" height="184" hidden aria-label="지도"></canvas>
<button id="zoomR" type="button" aria-label="확대 되돌리기" hidden></button>

function startExam(key) {

}
function nextExamGame() {
  const L = LIC[exam.key], name = L.games[exam.gi]; exam.s = GAMES[name].init(exam.lvl); exam.game = GAMES[name];
  showOv('<h2>' + L.e + ' ' + L.n + ' ' + exam.lvl + '급 시험' + (L.games.length > 1 ? ' · ' + (exam.gi + 1) + '교시 ' + exam.s.title : '') + '</h2><p class="sub exh">' + exam.s.help + '</p><canvas id="ex" width="' + EW * 2 + '" height="' + EH * 2 + '"></canvas><br><button class="btn alt exq" id="exq" type="button">포기</button>');
  const el = $('ex'), pos = e => { const r = el.getBoundingClientRect(); return [(e.clientX - r.left) * EW / r.width, (e.clientY - r.top) * EH / r.height]; };
  el.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); try { el.setPointerCapture(e.pointerId); } catch (err) { } const p = pos(e); exDown(p[0], p[1]); });
  el.addEventListener('pointermove', e => { const p = pos(e); exMove(p[0], p[1]); }); ['pointerup', 'pointercancel'].forEach(n => el.addEventListener(n, () => exUp()));
  $('exq').onclick = () => examEnd(false, '시험을 포기했어요');
}
function exDown(x, y) { if (exam && exam.s && !exam.s.res && exam.game.down) exam.game.down(exam.s, x, y); }
function exMove(x, y) { if (exam && exam.s && !exam.s.res && exam.game.move) exam.game.move(exam.s, x, y); }
function exUp() { if (exam && exam.s && !exam.s.res && exam.game.up) exam.game.up(exam.s); }
function updateExam(dt) {
  if (!exam || !exam.s) return; const s = exam.s, el = $('ex');
  if (!s.res) exam.game.update(s, dt); else { exam.hold += dt; if (exam.hold > .9) { exam.hold = 0; if (s.res === 'fail') examEnd(false, s.why); else if (++exam.gi < LIC[exam.key].games.length) nextExamGame(); else examEnd(true); return; } }
  if (!el) return; const c = el.getContext('2d'); c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, EW, EH); rr(c, 0, 0, EW, EH, 0, '#fdf3d8'); exam.game.draw(s, c);
  if (s.res) { rr(c, 0, 0, EW, EH, 0, s.res === 'pass' ? 'rgba(63,174,106,.3)' : 'rgba(226,73,63,.3)'); txt(c, s.res === 'pass' ? '통과!' : '실패…', EW / 2, EH / 2, 50, s.res === 'pass' ? '#2f8f55' : '#c0392b', 'center', '#fff'); }

  if (pass) { lic[key] = lvl; saveGame(); SFX.praise();
    showOv('<h2>🎉 합격!</h2><div class="cert"><b>' + L.e + ' ' + L.n + ' 자격증 ' + lvl + '급</b>' + L.perk[lvl - 1] + '</div><button class="btn" id="go">확인</button>'); $('go').onclick = () => openShop('lic'); }
  else { SFX.scold(); const fee = L.fee[lvl - 1];
    showOv('<h2>불합격…</h2><p>' + (why || '') + '</p><p class="sub">응시료는 돌아오지 않아요. 다시 보려면 응시료를 또 내야 해요.</p><button class="btn" id="go"' + (money >= fee ? '' : ' disabled') + '>다시 응시 (' + fee.toLocaleString() + '원)</button> <button class="btn alt" id="back">돌아가기</button>');
    $('go').onclick = () => { if (money >= fee) startExam(key); }; $('back').onclick = () => openShop('lic'); }

/* ---------- 땅에 내려놓은 먹이 더미 ----------
   든 먹이는 어디에든 내려놓고 다시 주울 수 있다. 창고는 안전하지만 땅에 둔 것은
   새가 쪼아 먹고, 바람 부는 날 날아가고, 비를 오래 맞으면 상해서 통째로 못 쓰게 된다 */
const MAX_PILES = 30, ROT_TIME = { drizzle: 45, rain: 22, typhoon: 14 };
let piles = [], pileNote = 0;
function dropFeed() {   // 손에 든 먹이를 그 자리에 내려놓는다 (가까이 같은 종류 더미가 있으면 합친다)
  if (state !== 'play' || pl.carry !== 'hay' || pl.hayN <= 0) return; initAudio(); const x = clamp(pl.x + pl.ax * 26, MAP.x0 + 20, MAP.x1 - 20), y = clamp(pl.y + pl.ay * 26, MAP.y0 + 20, MAP.y1 - 20), t = pl.feedType;
  let q = piles.find(q => q.type === t && Math.hypot(q.x - x, q.y - y) < 50); if (!q) { if (piles.length >= MAX_PILES) { showToast('더미가 너무 많아요. 가까운 더미에 합치거나 창고에 넣으세요'); return; } q = { x, y, type: t, n: 0, rot: 0 }; piles.push(q); }
  q.n += pl.hayN; pl.hayN = 0; pl.carry = null; SFX.sweep(); burst(q.x, q.y, 'dust', 4); say(q, feedInfo(t).e + ' ' + Math.floor(q.n) + ' 내려놓음', '#4a3226'); saveGame();
}
const nearPile = () => { let b = null, bd = 60; for (const q of piles) { const d = Math.hypot(q.x - pl.x, q.y - pl.y); if (d < bd) { bd = d; b = q; } } return b; };
function pileLoss(q, why) { if (!(pileNote > gt)) { pileNote = gt + 8; showToast(why, 5); } }
function updatePiles(dt) {
  const W = WX[wx], day2 = !isNight();
  for (const q of piles) {
    if (day2 && W.blow && Math.random() < dt * W.blow * 1.6) { q.n -= 1; burst(q.x, q.y, 'dust', 4); pileLoss(q, '💨 땅에 둔 ' + feedInfo(q.type).n + '이(가) 바람에 날아가고 있어요. 창고에 넣으면 안전해요'); }   // 바람
    if (day2 && ROT_TIME[wx]) { q.rot += dt; if (q.rot >= ROT_TIME[wx]) { say(q, '☔ 비에 젖어 상했어요', '#7a6a4f', 1); pileLoss(q, '☔ 땅에 둔 ' + feedInfo(q.type).n + ' ' + Math.floor(q.n) + '개가 비에 젖어 상했어요'); q.n = 0; } else if (q.rot > ROT_TIME[wx] * .4) pileLoss(q, '☔ 땅에 둔 ' + feedInfo(q.type).n + '이(가) 비에 젖고 있어요. 곧 상해요!'); }   // 비
    else if (q.rot > 0) q.rot = Math.max(0, q.rot - dt * .5); }
  piles = piles.filter(q => q.n >= 1);
